name: CI/CD Pipeline

on:
  push:
    branches: [fix/dockerfile-paths]
  pull_request:
    branches: [fix/dockerfile-paths]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnostic — list Dockerfiles and repo root
        run: |
          echo "=== Current working directory ==="
          pwd
          echo "=== Dockerfiles (case-insensitive) ==="
          find . -maxdepth 4 -type f -iname 'dockerfile*' -print || true
          echo "=== Dockerfile exact matches ==="
          find . -maxdepth 4 -type f -name 'Dockerfile' -print || true
          echo "=== Repo top-level ==="
          ls -la

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .                    # repo root so COPY backend/ works
          file: ./backend/Dockerfile    # correct path to Dockerfile (no leading slash)
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mean-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/mean-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .                    # repo root so COPY frontend/ works
          file: ./frontend/Dockerfile   # correct path to Dockerfile (no leading slash)
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mean-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/mean-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /opt/mean-app
            docker-compose pull
            docker-compose up -d
            docker system prune -af
