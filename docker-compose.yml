services:
  mongodb:
    image: mongo:7.0
    container_name: mean-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "admin"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD}"
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: mohitsoniv/backend-crud:latest
    container_name: mean-backend
    restart: unless-stopped
    environment:
      MONGODB_URI: "mongodb://admin:${MONGO_PASSWORD}@mongodb:27017/meandb?authSource=admin"
      MONGO_URI: "mongodb://admin:${MONGO_PASSWORD}@mongodb:27017/meandb?authSource=admin"
      PORT: "3000"
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    image: mohitsoniv/frontend-crud:latest
    container_name: mean-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
